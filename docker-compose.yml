version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imdb-ratings-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/ratings.db
      - IMDB_DATASET_URL=https://datasets.imdbws.com/title.ratings.tsv.gz
      - UPDATE_CRON_SCHEDULE=0 3 * * *
      - AUTO_SEED=true
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3
